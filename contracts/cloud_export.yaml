version: export-v2
allow_new_columns: false
max_json_depth: 8
json_scalar_max_bytes: 4096
url_hosts:
- community.secop.gov.co
- www.community.secop.gov.co
json_policies:
  observation_condition:
    keys:
    - schema_version
    - scope_id
    - silver_version_id
    - contract_key
    - state
    - winner_payload_sha256
    - winner_run_id
    - winner_page_sha256
    - winner_row_ordinal
    - winner_observed_at_utc
    - winner_profile_sha256
    - winner_projection_version
    - validation_version
    - later_invalid_count
    - equal_invalid_count
  attributable_rejection_evidence:
    array:
      keys:
      - schema_version
      - scope_id
      - silver_version_id
      - contract_key
      - link_id
      - temporal_relation
      - winner_payload_sha256
      - winner_run_id
      - winner_page_sha256
      - winner_row_ordinal
      - winner_observed_at_utc
      - winner_profile_sha256
      - winner_projection_version
      - rejected_payload_sha256
      - rejected_run_id
      - rejected_page_sha256
      - rejected_row_ordinal
      - rejected_observed_at_utc
      - rejected_profile_sha256
      - rejected_projection_version
      - validation_version
      - rejection_codes
  selection_metadata:
    keys:
    - entity_keys
    - municipality_keys
    - modality_keys
    - statuses
    - exclude_statuses
    - start_date
    - end_date
    - missing_signatures
    - selected_supplier
  reference_metadata:
    keys:
    - entity_keys
    - municipality_keys
    - modality_keys
    - statuses
    - exclude_statuses
    - start_date
    - end_date
    - missing_signatures
  status_distribution:
    integer_map: true
  scope:
    keys:
    - schema_version
    - dataset_id
    - department_field
    - department_value
    - basis
    - signing_field
    - missing_signing
    - source_clock
    - signing_from
    - signing_to
  coverage_metadata:
    keys:
    - state
    - basis
    - coverage_known
    - scope_id
    - limitations
    - acquisitions
    children:
      acquisitions:
        array:
          keys:
          - schema_version
          - campaign_id
          - plan_id
          - scope_id
          - state
          - limits
          - consumed
          - scope_scan_complete
          - baseline_check_complete
          - unconfirmed_ids
          - observed_from_utc
          - observed_to_utc
          - truncated
          - limitations
          - baseline
          children:
            limits:
              keys:
              - rows
              - attempts
            consumed:
              keys:
              - rows
              - attempts
            baseline:
              keys:
              - silver_version_id
              - manifest_sha256
              - keys_sha256
relations:
  silver_valid:
    partition_by_signing: true
    columns:
      - {name: silver_version_id, source_type: string, codec: text}
      - {name: contract_key, source_type: string, codec: text}
      - {name: source_dataset_id, source_type: string, codec: text}
      - {name: source_contract_id, source_type: string, codec: text}
      - {name: contract_reference, source_type: string, codec: text}
      - {name: procurement_process_id, source_type: string, codec: text}
      - {name: department_key, source_type: string, codec: text}
      - {name: municipality_key, source_type: string, codec: text}
      - {name: municipality_status, source_type: string, codec: text}
      - {name: is_medellin, source_type: bool, codec: bool}
