      - {name: contract_type, source_type: string, codec: text}
      - {name: procurement_method, source_type: string, codec: text}
      - {name: signing_date, source_type: 'date32[day]', codec: date}
      - {name: start_date, source_type: 'date32[day]', codec: date}
      - {name: end_date, source_type: 'date32[day]', codec: date}
