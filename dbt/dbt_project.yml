name: observatorio_secop
version: 1.0.0
config-version: 2

profile: observatorio_secop

# dbt-core 1.10 can lose ref() dependencies nondeterministically when its
# static parser recompiles this project for --full-refresh. The full parser is
# slower but preserves the DAG, which is required for a safe rebuild.
flags:
  static_parser: false

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

models:
  observatorio_secop:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    dimensions:
      +materialized: incremental
      +incremental_strategy: delete+insert
      +on_schema_change: fail
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics
    facts:
      +materialized: incremental
      +incremental_strategy: delete+insert
      +on_schema_change: fail
      +schema: analytics

vars:
  star_key_version: star_key_v1
  identity_key_version: platform_code_key_v1

  gold_policy_version: gold-hhi-policy-v1
  gold_min_count_coverage: 1
  gold_min_value_coverage: 1
  gold_catalog_sha256: bc1757e080215c38a6005a2b3612303299eb6f0954a7023451c7bfbeb83bfee5
  gold_policy_sha256: eabc877d527133dd89f5184f77add49ddba56fcb2e82949bf31d658df66789f4

on-run-start:
  - "{{ gold_capture_build() }}"
on-run-end:
  - "{{ gold_verify_build() }}"
