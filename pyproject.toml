[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "observatorio-secop"
version = "0.1.0"
description = "Base local reproducible del Observatorio de contratación pública de Antioquia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Observatorio SECOP contributors" }]
dependencies = [
  "pyyaml>=6,<7",
]

[project.scripts]
secop-source-profile = "observatorio_secop.source_profile.cli:main"
secop-ingest = "observatorio_secop.ingestion.cli:main"
secop-silver = "observatorio_secop.processing.silver.cli:main"
secop-warehouse = "observatorio_secop.warehouse.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
  "types-pyyaml>=6,<7",
]
data = [
  "pandera[pyspark]>=0.23,<0.24",
  "pyspark[connect]>=3.5,<3.6",
  "setuptools>=75,<76",
]
warehouse = [
  "dbt-core>=1.10,<1.11",
  "dbt-postgres>=1.9,<1.10",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<20",
]
orchestration = [
  "apache-airflow>=2.10,<2.11",
]
ml = [
  "mlflow>=3.4,<3.5",
  "scikit-learn>=1.6,<1.7",
]
api = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio_secop"]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
