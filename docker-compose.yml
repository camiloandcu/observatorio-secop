name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:?AIRFLOW_IMAGE is required}
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:?AIRFLOW_UID is required}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${AIRFLOW_DB:?AIRFLOW_DB is required}
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
    AIRFLOW__WEBSERVER__WORKERS: "1"
  volumes:
    - ./dags:/opt/airflow/dags:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AIRFLOW_DB: ${AIRFLOW_DB:?AIRFLOW_DB is required}
      MLFLOW_DB: ${MLFLOW_DB:?MLFLOW_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]

  airflow-webserver:
    <<: *airflow-common
    command: ["webserver"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:?AIRFLOW_PORT is required}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  mlflow:
    profiles: ["mlflow"]
    build:
      context: .
      dockerfile: infra/docker/mlflow/Dockerfile
      args:
        MLFLOW_IMAGE: ${MLFLOW_IMAGE:?MLFLOW_IMAGE is required}
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${MLFLOW_DB:?MLFLOW_DB is required}
      - --default-artifact-root=/mlruns
    ports:
      - "127.0.0.1:${MLFLOW_PORT:?MLFLOW_PORT is required}:5000"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: "no"

volumes:
  postgres_data:
