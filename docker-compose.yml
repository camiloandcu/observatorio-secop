name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-airflow-common: &airflow-common
  image: observatorio-secop-airflow:local
  build:
    context: .
    dockerfile: infra/docker/airflow/Dockerfile
    args:
      AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:?AIRFLOW_IMAGE is required}
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:?AIRFLOW_UID is required}:0"
  working_dir: /opt/secop
  read_only: true
  tmpfs:
    - /tmp:mode=1777,exec,size=512m
  environment: &airflow-environment
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/local-state/passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /opt/airflow/local-state/jwt-secret
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${AIRFLOW_DB:?AIRFLOW_DB is required}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: >-
      postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${AIRFLOW_DB:?AIRFLOW_DB is required}
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__PARALLELISM: "2"
    JAVA_TOOL_OPTIONS: "-Xss512k -XX:ActiveProcessorCount=2"
    SECOP_PIPELINE_ROOT: /opt/secop-data/orchestration
    SECOP_REPORT_ROOT: /opt/secop-reports
    SECOP_RUNTIME_MODE: ${SECOP_RUNTIME_MODE:-demo}
    BRONZE_ROOT: /opt/secop-data/bronze
    SILVER_ROOT: /opt/secop-data/silver/secop_contracts
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
  volumes:
    - airflow_local_state:/opt/airflow
    - ./dags:/opt/airflow/dags:ro
    - pipeline_data:/opt/secop-data
    - pipeline_reports:/opt/secop-reports
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AIRFLOW_DB: ${AIRFLOW_DB:?AIRFLOW_DB is required}
      MLFLOW_DB: ${MLFLOW_DB:?MLFLOW_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - |
        python - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        import secrets

        for root in (Path("/opt/secop-data"), Path("/opt/secop-reports")):
            probe = root / ".write-probe"
            try:
                probe.touch(exist_ok=False)
                probe.unlink()
            except OSError:
                raise SystemExit("Pipeline writable-root preflight failed; check UID/group permissions") from None
        state = Path("/opt/airflow/local-state")
        state.mkdir(mode=0o700, exist_ok=True)
        for name, value in (
            ("jwt-secret", secrets.token_urlsafe(48)),
            ("passwords.json", json.dumps({"admin": secrets.token_urlsafe(32)})),
        ):
            path = state / name
            try:
                descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            except FileExistsError:
                continue
            with os.fdopen(descriptor, "w") as stream:
                stream.write(value)
        PYTHON
        exec airflow db migrate

  airflow-api-server:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:?AIRFLOW_PORT is required}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/opt/secop/scripts/airflow_health.py",
          "--job-type",
          "SchedulerJob",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/opt/secop/scripts/airflow_health.py",
          "--job-type",
          "DagProcessorJob",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  mlflow:
    profiles: ["mlflow"]
    build:
      context: .
      dockerfile: infra/docker/mlflow/Dockerfile
      args:
        MLFLOW_IMAGE: ${MLFLOW_IMAGE:?MLFLOW_IMAGE is required}
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${MLFLOW_DB:?MLFLOW_DB is required}
      - --default-artifact-root=/mlruns
    ports:
      - "127.0.0.1:${MLFLOW_PORT:?MLFLOW_PORT is required}:5000"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: "no"

volumes:
  postgres_data:
  airflow_local_state:
  pipeline_data:
  pipeline_reports:
